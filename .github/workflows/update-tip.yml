name: Update TRMNL Tip

on:
  schedule:
    - cron: "0 5 * * *"   # 5am UTC = midnight EST / 1am EDT
  workflow_dispatch:

jobs:
  update-tip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select next tip in order
        run: |
          TOTAL=$(jq length tips.json)

          if [ ! -f index.txt ]; then
            echo 0 > index.txt
          fi

          INDEX=$(cat index.txt)
          NEXT_INDEX=$((INDEX % TOTAL))

          jq -c ".[$NEXT_INDEX]" tips.json > api.json

          echo $((INDEX + 1)) > index.txt

      - name: Commit updated tip
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add api.json index.txt
          git commit -m "Daily tip update" || exit 0
          git push
